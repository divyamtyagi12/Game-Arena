name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN secret is not set in GitHub repository settings."
            exit 1
          fi
          echo "Deploying latest codebase to Railway..."
          railway up --service f51723ed-ff72-451b-913e-905655829cdf --environment c7d99b85-b979-479f-ac39-816bde8b779c -p 06012c50-17f5-4b56-a88c-a74b0ffdfc71 --detach
          echo "Successfully uploaded and initiated Railway deployment."
